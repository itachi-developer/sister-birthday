<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tanti Auguri! ❤️</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff9a9e">
    <!-- Libreria per i coriandoli -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <!-- HOME -->
    <section id="home" class="view active">
        <div class="container">
            <h1>Buon 17° Compleanno! 🎉</h1>
            <p>Ho creato questa piccola app per te.</p>
            <div class="hero-image">🎂</div>
            <p class="hint">Esplora i bottoni qui sotto 👇</p>
        </div>
    </section>

    <!-- TRIS -->
    <section id="tris" class="view">
        <div class="container">
            <h2>Tris di Facce</h2>
            <div class="status" id="tris-status">Tocca a te!</div>
            <div class="board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
            <button class="btn" id="reset-tris">Ricomincia</button>
        </div>
    </section>

    <!-- SNAKE -->
    <section id="snake" class="view">
        <div class="container">
            <h2>Hungry Sister 🍕</h2>
            <p>Punteggio: <span id="score">0</span></p>
            <canvas id="gameCanvas" width="300" height="300"></canvas>
            
            <!-- Controlli Touch per Mobile -->
            <div class="controls">
                <div class="d-pad">
                    <button id="up">⬆️</button>
                    <div class="middle-row">
                        <button id="left">⬅️</button>
                        <button id="right">➡️</button>
                    </div>
                    <button id="down">⬇️</button>
                </div>
            </div>
        </div>
    </section>

    <!-- PLAYLIST -->
    <section id="musica" class="view">
        <div class="container">
            <h2>Le nostre canzoni 🎵</h2>
            <p>Una colonna sonora tutta per te.</p>
            <!-- INSERISCI QUI IL TUO IFRAME DI SPOTIFY -->
            <iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM5M?utm_source=generator" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>
    </section>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-target="home">🏠<span>Home</span></button>
        <button class="nav-item" data-target="tris">❌⭕<span>Tris</span></button>
        <button class="nav-item" data-target="snake">🐍<span>Snake</span></button>
        <button class="nav-item" data-target="musica">🎵<span>Musica</span></button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
